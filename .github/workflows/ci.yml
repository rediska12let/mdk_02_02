name: .NET 8 CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore tests
        run: dotnet restore tests/MedicalRecords.Tests/MedicalRecords.Tests.csproj
      - name: Run unit tests
        run: dotnet test tests/MedicalRecords.Tests/MedicalRecords.Tests.csproj --no-restore --configuration Release
