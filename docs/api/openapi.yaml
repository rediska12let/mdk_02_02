openapi: 3.0.3
info:
  title: MedicalRecords API
  version: 1.0.0
  description: Educational medical records API (synthetic data only)
servers:
  - url: http://127.0.0.1:5076
paths:
  /health:
    get:
      summary: API health
      responses:
        '200':
          description: Healthy
  /api/v1/patients:
    get:
      summary: List patients assigned to current clinician (admin sees all)
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Patient list
        '401':
          description: Not authenticated
    post:
      summary: Create a patient assigned to current actor
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatient'
      responses:
        '201':
          description: Created
        '400':
          description: Validation error
  /api/v1/patients/{id}:
    get:
      summary: Get patient; clinician assignment is checked
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Patient
        '403':
          description: Not assigned
        '404':
          description: Not found
  /api/v1/patients/{id}/encounters:
    get:
      summary: List encounters after access check
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Encounter list
        '403':
          description: Not assigned
    post:
      summary: Add an encounter after access check
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clinicalNote]
              properties:
                clinicalNote: {type: string, minLength: 2, maxLength: 4000}
      responses:
        '201':
          description: Created
        '400':
          description: Invalid note
        '403':
          description: Not assigned
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    CreatePatient:
      type: object
      required: [familyName, givenName, birthDate]
      properties:
        familyName: {type: string, minLength: 2, maxLength: 100}
        givenName: {type: string, minLength: 2, maxLength: 100}
        birthDate: {type: string, format: date}
